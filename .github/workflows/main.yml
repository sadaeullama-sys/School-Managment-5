if not plugins:
                      raise SystemExit("ERROR: Could not find plugins block in build.gradle.kts")
                  setup = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          """
                  source = source[:plugins.end()] + "\n" + setup + "\n" + source[plugins.end():]
              android_block = re.search(r"\bandroid\s*\{", source)
              if not android_block:
                  raise SystemExit("ERROR: Could not find android block in build.gradle.kts")
              if 'create("release")' not in source:
                  signing = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          """
                  source = source[:android_block.end()] + "\n" + signing + "\n" + source[android_block.end():]
              source = source.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")'
              )
              release_block = re.search(r"release\s*\{", source)
              if not release_block:
                  raise SystemExit("ERROR: Could not find release buildType in build.gradle.kts")
              if 'signingConfig = signingConfigs.getByName("release")' not in source[release_block.end():]:
                  source = source[:release_block.end()] + '\n            signingConfig = signingConfigs.getByName("release")' + source[release_block.end():]
              path.write_text(source)

          elif groovy.exists():
              path = groovy
              source = path.read_text()
              if "import java.util.Properties" not in source:
                  source = "import java.util.Properties\nimport java.io.FileInputStream\n" + source
              if "def keystoreProperties =" not in source:
                  plugins = re.search(r"plugins\s*\{.*?\}", source, re.S)
                  if not plugins:
                      raise SystemExit("ERROR: Could not find plugins block in build.gradle")
                  setup = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          """
                  source = source[:plugins.end()] + "\n" + setup + "\n" + source[plugins.end():]
              android_block = re.search(r"\bandroid\s*\{", source)
              if not android_block:
                  raise SystemExit("ERROR: Could not find android block in build.gradle")
              if "signingConfigs {" not in source:
                  signing = """
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
          """
                  source = source[:android_block.end()] + "\n" + signing + "\n" + source[android_block.end():]
              source = source.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              release_block = re.search(r"release\s*\{", source)
              if not release_block:
                  raise SystemExit("ERROR: Could not find release buildType in build.gradle")
              if "signingConfig signingConfigs.release" not in source[release_block.end():]:
                  source = source[:release_block.end()] + "\n            signingConfig signingConfigs.release" + source[release_block.end():]
              path.write_text(source)
          else:
              raise SystemExit("ERROR: Android app Gradle file not found.")
          print("Release signing configuration added.")
          PY

      - name: Analyze Dart source
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x :image_picker_android:lintVitalAnalyzeRelease

      - name: Build signed Play Store AAB
        working-directory: android
        run: ./gradlew bundleRelease -x :image_picker_android:lintVitalAnalyzeRelease

      - name: Collect release files
        shell: bash
        run: |
          set -e
          mkdir -p release-artifacts

          APK_FILE="$(find build android/app/build -type f -name '*.apk' ! -path '*androidTest*' 2>/dev/null | head -n 1)"
          AAB_FILE="$(find build android/app/build -type f -name '*.aab' 2>/dev/null | head -n 1)"

          echo "APK found: ${APK_FILE:-NOT FOUND}"
          echo "AAB found: ${AAB_FILE:-NOT FOUND}"

          if [ -z "$APK_FILE" ] || [ -z "$AAB_FILE" ]; then
            echo "ERROR: APK or AAB was not found. Available output files:"
            find build android/app/build -type f \( -name '*.apk' -o -name '*.aab' \) -print 2>/dev/null || true
            exit 1
          fi

          cp "$APK_FILE" release-artifacts/school-management-system-release.apk
          cp "$AAB_FILE" release-artifacts/school-management-system-release.aab
          ls -lh release-artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-management-system-release-apk
          path: release-artifacts/school-management-system-release.apk
          if-no-files-found: error

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-management-system-signed-aab
          path: release-artifacts/school-management-system-release.aab
          if-no-files-found: error
