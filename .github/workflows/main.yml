name: Build School Management System APK and AAB

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project
        run: |
          test -f pubspec.yaml
          test -d lib
          flutter --version

      - name: Generate or update Android platform files
        run: flutter create --project-name school_management_system --org com.ilyasmobile --platforms=android .

      - name: Set application ID
        shell: bash
        run: |
          set -e
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = ".*"/applicationId = "com.ilyasmobile.schoolmanagementsystem"/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i "s/applicationId .*/applicationId 'com.ilyasmobile.schoolmanagementsystem'/" android/app/build.gradle
          else
            echo "ERROR: Android app Gradle file not found."
            exit 1
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: One or more GitHub signing secrets are missing."
            exit 1
          fi

          # Decode the Windows certutil -encode output, including its PEM header/footer.
          printf '%s' "$KEYSTORE_BASE64" \
            | sed '/-----BEGIN CERTIFICATE-----/d; /-----END CERTIFICATE-----/d' \
            | tr -d '\r\n ' \
            | base64 --decode > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          python3 <<'PY'
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              path = kts
              source = path.read_text()

              if "import java.util.Properties" not in source:
                  source = "import java.util.Properties\nimport java.io.FileInputStream\n" + source

              if "val keystoreProperties =" not in source:
                  plugins = re.search(r"plugins\s*\{.*?\}", source, re.S)
                  if not plugins:
                      raise SystemExit("ERROR: Could not find plugins block in build.gradle.kts")
                  setup = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          """
                  source = source[:plugins.end()] + "\n" + setup + "\n" + source[plugins.end():]

              android_block = re.search(r"\bandroid\s*\{", source)
              if not android_block:
                  raise SystemExit("ERROR: Could not find android block in build.gradle.kts")

              if 'create("release")' not in source:
                  signing = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          """
                  source = source[:android_block.end()] + "\n" + signing + "\n" + source[android_block.end():]

              # Replace the default debug signing used by Flutter's release build.
              source = source.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")'
              )

              release_block = re.search(r"release\s*\{", source)
              if not release_block:
                  raise SystemExit("ERROR: Could not find release buildType in build.gradle.kts")

              after_release = source[release_block.end():]
              if 'signingConfig = signingConfigs.getByName("release")' not in after_release:
                  source = (
                      source[:release_block.end()]
                      + '\n            signingConfig = signingConfigs.getByName("release")'
                      + source[release_block.end():]
                  )

              path.write_text(source)

          elif groovy.exists():
              path = groovy
              source = path.read_text()

              if "import java.util.Properties" not in source:
                  source = "import java.util.Properties\nimport java.io.FileInputStream\n" + source

              if "def keystoreProperties =" not in source:
                  plugins = re.search(r"plugins\s*\{.*?\}", source, re.S)
                  if not plugins:
                      raise SystemExit("ERROR: Could not find plugins block in build.gradle")
                  setup = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          """
                  source = source[:plugins.end()] + "\n" + setup + "\n" + source[plugins.end():]

              android_block = re.search(r"\bandroid\s*\{", source)
              if not android_block:
                  raise SystemExit("ERROR: Could not find android block in build.gradle")

              if "signingConfigs {" not in source:
                  signing = """
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
          """
                  source = source[:android_block.end()] + "\n" + signing + "\n" + source[android_block.end():]

              source = source.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release"
              )

              release_block = re.search(r"release\s*\{", source)
              if not release_block:
                  raise SystemExit("ERROR: Could not find release buildType in build.gradle")

              after_release = source[release_block.end():]
              if "signingConfig signingConfigs.release" not in after_release:
                  source = (
                      source[:release_block.end()]
                      + "\n            signingConfig signingConfigs.release"
                      + source[release_block.end():]
                  )

              path.write_text(source)
          else:
              raise SystemExit("ERROR: Android app Gradle file not found.")

          print("Release signing configuration added.")
          PY

      - name: Analyze Dart source
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Build signed Play Store AAB
        run: flutter build appbundle --release

      - name: Verify release files
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          echo "APK and AAB files created successfully."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-management-system-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-management-system-signed-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
